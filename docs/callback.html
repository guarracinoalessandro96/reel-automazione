<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collegamento</title>
<style>
  body { margin:0; background:#fafaf8; color:#1b1b1b; font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  textarea { width:100%; height:120px; font:14px monospace; padding:10px; border:1px solid #ccc; border-radius:8px; }
  button { margin-top:10px; padding:10px 16px; border:0; border-radius:8px; background:#111; color:#fff; font-size:15px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { body { background:#121212; color:#eee; } textarea { background:#1b1b1b; color:#eee; border-color:#333; } }
</style>
</head>
<body>
<main>
  <h1>Collegamento</h1>
  <p id="msg">Copia questo codice e incollalo nella finestra nera sul computer.</p>
  <textarea id="code" readonly></textarea>
  <button onclick="navigator.clipboard.writeText(document.getElementById('code').value);this.textContent='Copiato'">Copia</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("error")) document.getElementById("msg").textContent = "Errore: " + (q.get("error_description") || q.get("error"));
  document.getElementById("code").value = q.get("code") || "";
</script>
</body>
</html>
