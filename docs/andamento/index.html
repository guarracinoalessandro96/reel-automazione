<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andamento social</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Social">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0906">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../icona-32.png">
<link rel="apple-touch-icon" href="../icona-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Notte dorata: fondo scuro caldo, oro che brilla, schede di vetro in 3D */
  :root {
    --bg: #0b0906; --bg2: #17120a; --glass: rgba(255, 214, 10, .055); --edge: rgba(255, 214, 10, .28);
    --oro: #ffd60a; --oro2: #ffb703; --crema: #fff3b0; --ambra: #fb8500; --testo: #fff8e1; --mute: #b9ab86;
    --su: #b8f171; --giu: #ff8a7a;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--testo); font: 15px/1.45 var(--sans);
         background: radial-gradient(120% 60% at 50% -10%, rgba(255, 183, 3, .22), transparent 60%),
                     radial-gradient(80% 50% at 100% 100%, rgba(251, 133, 0, .12), transparent 60%), var(--bg);
         background-attachment: fixed;
         padding: calc(env(safe-area-inset-top, 0px) + 28px) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #stelle { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
  h2 { font: 800 1.5rem/1.15 var(--serif); margin: 0; letter-spacing: .01em; color: var(--oro); text-shadow: 0 0 18px rgba(255, 190, 0, .45); }
  .sec { display: flex; flex-direction: column; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; perspective: 900px; }

  .card { position: relative; border-radius: 20px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
          background: linear-gradient(160deg, rgba(255, 230, 120, .10), rgba(255, 214, 10, .02) 45%, rgba(0, 0, 0, .25)), var(--bg2);
          border: 1px solid var(--edge);
          box-shadow: 0 1px 0 rgba(255, 240, 180, .25) inset, 0 18px 40px -18px rgba(0, 0, 0, .9), 0 0 0 1px rgba(0, 0, 0, .4);
          transform-style: preserve-3d; transition: transform .25s ease-out, box-shadow .25s; will-change: transform; overflow: hidden; }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 230, 120, .16), transparent 60%); }
  .card.tot { grid-column: 1 / -1; padding: 20px; border-color: rgba(255, 214, 10, .55);
              box-shadow: 0 1px 0 rgba(255, 240, 180, .35) inset, 0 0 40px -6px rgba(255, 183, 3, .35), 0 22px 50px -20px rgba(0, 0, 0, .9); }
  .card h3 { margin: 0; font: 600 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 7px; transform: translateZ(20px); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
  .big { font: 800 2.1rem/1.05 var(--serif); font-variant-numeric: tabular-nums; transform: translateZ(40px);
         background: linear-gradient(180deg, #fffbe6, var(--oro) 60%, var(--oro2)); -webkit-background-clip: text; background-clip: text; color: transparent;
         filter: drop-shadow(0 3px 10px rgba(255, 190, 0, .35)); }
  .card.tot .big { font-size: 3.1rem; }
  .day { font-size: .78rem; color: var(--mute); transform: translateZ(15px); }
  .cmp { list-style: none; margin: 6px 0 0; padding: 10px 0 0; border-top: 1px solid rgba(255, 214, 10, .15); display: grid; gap: 4px; font-size: .8rem; transform: translateZ(10px); }
  .card.tot .cmp { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card.tot .cmp li { flex-direction: column; gap: 2px; }
  .cmp li { display: flex; justify-content: space-between; gap: 8px; color: var(--mute); }
  .cmp b { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; color: var(--testo); }
  .confronta { display: flex; flex-direction: column; gap: 8px; }
  .confronta span { font-size: .78rem; color: var(--mute); letter-spacing: .04em; }
  .badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 6px 12px 6px 9px; border-radius: 999px;
           font: 700 1rem/1 var(--sans); font-variant-numeric: tabular-nums; transform: translateZ(30px); }
  .badge .fr { font-size: 1.05rem; }
  .badge.su { background: rgba(184, 241, 113, .14); border: 1px solid rgba(184, 241, 113, .5); box-shadow: 0 0 16px rgba(184, 241, 113, .25); }
  .badge.giu { background: rgba(255, 138, 122, .14); border: 1px solid rgba(255, 138, 122, .5); box-shadow: 0 0 16px rgba(255, 138, 122, .25); }
  .badge.pari { background: rgba(255, 243, 176, .08); border: 1px solid rgba(255, 243, 176, .3); color: var(--crema); }
  .badge.nd { background: transparent; border: 1px dashed rgba(255, 214, 10, .3); color: var(--mute); font: 500 .76rem/1.2 var(--sans); }
  .card.tot .badge { font-size: 1.25rem; padding: 8px 14px 8px 11px; }
  .card.tot .badge.nd { font-size: .8rem; padding: 6px 12px; }
  .frase { font-size: .8rem; color: var(--mute); transform: translateZ(10px); }
  .frase b { color: var(--testo); font-weight: 600; font-variant-numeric: tabular-nums; }
  .duo { display: grid; gap: 5px; margin-top: 4px; transform: translateZ(14px); }
  .duo div { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-size: .7rem; color: var(--mute); }
  .duo em { display: block; height: 8px; border-radius: 99px; background: rgba(255, 243, 176, .07); overflow: hidden; }
  .duo i { display: block; height: 100%; border-radius: 99px; min-width: 3px; }
  .duo .p { background: rgba(255, 243, 176, .28); }
  .duo .o { background: linear-gradient(90deg, var(--oro2), var(--oro)); box-shadow: 0 0 10px rgba(255, 200, 0, .5); }
  .su { color: var(--su) !important; } .giu { color: var(--giu) !important; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { font: 600 .82rem/1 var(--sans); padding: 9px 14px; border-radius: 999px; cursor: pointer; color: var(--mute);
                 background: rgba(255, 214, 10, .06); border: 1px solid rgba(255, 214, 10, .22); transition: all .2s; }
  .tabs button[aria-pressed="true"] { color: #2a1d00; background: linear-gradient(180deg, var(--crema), var(--oro) 50%, var(--oro2)); border-color: var(--oro);
                 box-shadow: 0 0 18px rgba(255, 200, 0, .45), 0 2px 0 rgba(255, 255, 255, .5) inset; }
  .tabs button:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
  .tabs.piccole button { padding: 7px 11px; font-size: .76rem; }
  .quando { font-size: .76rem; color: var(--mute); margin: -4px 0 0; }

  /* 21/11: follower in alto, una striscia piccola (niente riquadri grandi) */
  .testa { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .folbox { border-radius: 16px; padding: 4px 14px; border: 1px solid var(--edge);
            background: linear-gradient(160deg, rgba(255, 230, 120, .08), rgba(0, 0, 0, .25)), var(--bg2);
            box-shadow: 0 1px 0 rgba(255, 240, 180, .2) inset, 0 14px 30px -18px rgba(0, 0, 0, .9); }
  table.fol { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.fol td { padding: 7px 0; border-top: 1px solid rgba(255, 214, 10, .12); vertical-align: middle; }
  table.fol tr:first-child td { border-top: 0; }
  table.fol td.s { display: flex; align-items: center; gap: 7px; color: var(--testo); white-space: nowrap; }
  table.fol td.n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  table.fol td.d { text-align: right; width: 1%; white-space: nowrap; padding-left: 12px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--mute); }
  table.fol tr.tot td { font: 800 1.15rem/1.2 var(--serif); color: var(--oro); }
  table.fol tr.tot td.d { font: 700 .95rem var(--sans); }
  table.fol small { font: 400 .68rem var(--sans); color: var(--mute); }
  .nota { font-size: .7rem; color: var(--mute); margin: 0; line-height: 1.4; }
  .agg { text-align: center; font-size: .74rem; color: var(--mute); margin: 0; opacity: .8; }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: sali .7s cubic-bezier(.2, .9, .2, 1) both; }
    .grid .card:nth-child(2) { animation-delay: .06s; } .grid .card:nth-child(3) { animation-delay: .12s; }
    .grid .card:nth-child(4) { animation-delay: .18s; } .grid .card:nth-child(5) { animation-delay: .24s; }
    @keyframes sali { from { transform: translateY(14px) rotateX(10deg); } }
  }
  @media (max-width: 520px) {
    main { gap: 26px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 13px; border-radius: 16px; }
    .big { font-size: 1.6rem; }
    .card.tot .big { font-size: 2.6rem; }
    .cmp li { flex-direction: column; gap: 0; }
    .card.tot .cmp { grid-template-columns: 1fr; gap: 4px; }
    .card.tot .cmp li { flex-direction: row; }
    .tabs button { padding: 8px 11px; font-size: .78rem; }
    .tabs.piccole button { padding: 7px 9px; font-size: .72rem; }
  }
</style>
</head>
<body>
<canvas id="stelle" aria-hidden="true"></canvas>
<main>
  <section class="sec">
    <div class="testa"><h2>Follower</h2>
      <div class="tabs piccole" role="group" aria-label="Confronta i follower con" data-conf="fol">
        <button type="button" data-c="1" aria-pressed="true">Giorno prima</button>
        <button type="button" data-c="7" aria-pressed="false">Settimana prima</button>
        <button type="button" data-c="30" aria-pressed="false">Mese prima</button>
      </div></div>
    <div class="folbox"><table class="fol" id="tab-fol"></table></div>
    <p class="nota" id="nota-fol"></p>
  </section>

  <section class="sec">
    <h2>Visualizzazioni</h2>
    <div class="tabs" role="group" aria-label="Periodo">
      <button type="button" data-p="oggi" aria-pressed="true">Oggi</button>
      <button type="button" data-p="ieri" aria-pressed="false">Ieri</button>
      <button type="button" data-p="sett" aria-pressed="false">Questa settimana</button>
      <button type="button" data-p="mese" aria-pressed="false">Questo mese</button>
      <button type="button" data-p="30" aria-pressed="false">Ultimi 30 giorni</button>
    </div>
    <div class="grid" id="schede-vis"></div>
    <p class="quando" id="quando"></p>
  </section>

  <p class="agg" id="agg"></p>
</main>

<script>
const SOC = [["YouTube", "#ffd60a"], ["Instagram", "#fff3b0"], ["TikTok", "#ffb703"], ["Facebook", "#fb8500"]];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const fmt = (v) => v === null || v === undefined ? "—" : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const dat = (iso) => { const d = new Date(iso + "T00:00:00Z"); return GIORNI[d.getUTCDay()] + " " + d.getUTCDate() + " " + MESI[d.getUTCMonth()]; };
const corta = (iso) => { const d = new Date(iso + "T00:00:00Z"); return d.getUTCDate() + "/" + (d.getUTCMonth() + 1); };
const indietro = (iso, k) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - k); return d.toISOString().slice(0, 10); };
const tra = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const c = (v) => v !== null && v !== undefined;
const segno = (d) => (d > 0 ? "+" : d < 0 ? "−" : "±") + fmt(Math.abs(d));
const MOTO = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let VIS = {}, FOL = {}, OGGI = {}, ROMA = {}, ADESSO = {}, PROVV = {}, PERIODO = "oggi", CONF_FOL = "1";

/* ---- follower (21/11/2026, Alessandro: in alto, una volta sola, piccoli, con giorno/settimana/mese prima) ---- */
function folPrima(s, g, k) {        // follower a fine giornata k giorni prima (o il giorno disponibile piu' vicino prima)
  const t = indietro(g, k);
  for (let j = 0; j < 4; j++) { const d = indietro(t, j), v = (FOL[d] || {})[s]; if (c(v)) return [v, d]; }
  return null;
}
function folAdesso(s) {
  if (ADESSO[s] && c(ADESSO[s].v)) return ADESSO[s];
  const g = Object.keys(FOL).filter((d) => c(FOL[d][s])).sort().pop();
  return g ? { v: FOL[g][s], g } : null;
}
function disegnaFollower() {
  const tab = document.getElementById("tab-fol"); tab.replaceChildren();
  const k = +CONF_FOL, oggiR = ADESSO.Instagram ? ADESSO.Instagram.g : null, righe = [], senza = [];
  let tot = 0, totD = 0, conD = 0;
  SOC.forEach(([s, col]) => {
    const a = folAdesso(s); if (!a) { senza.push(s); righe.push([s, col, null, null, ""]); return; }
    const p = folPrima(s, a.g, k);
    tot += a.v; if (p) { totD += a.v - p[0]; conD++; } else senza.push(s);
    righe.push([s, col, a.v, p ? a.v - p[0] : null, a.g !== oggiR ? "al " + corta(a.g) : ""]);
  });
  const riga = (cls, nome, col, v, d, al) => {
    const tr = el("tr", cls), ts = el("td", "s");
    if (col) { const dt = el("span", "dot"); dt.style.background = col; dt.style.color = col; ts.append(dt); }
    ts.append(nome); if (al) ts.append(el("small", "", al));
    const td = el("td", "d" + (c(d) ? (d > 0 ? " su" : d < 0 ? " giu" : "") : ""), c(d) ? segno(d) : "—");
    tr.append(ts, el("td", "n", fmt(v)), td); tab.append(tr);
  };
  riga("tot", "Totale", null, tot, conD ? totD : null, "");
  righe.forEach(([s, col, v, d, al]) => riga("", s, col, v, d, al));
  const nomeK = k === 1 ? "il giorno prima" : k === 7 ? "7 giorni prima" : "30 giorni prima";
  const note = ["Differenza con " + nomeK + (senza.length ? " (totale senza " + senza.join(", ") + ")" : "") + "."];
  const yt = ADESSO.YouTube;
  if (yt && c(yt.arrotondato) && yt.arrotondato !== yt.v) note.push("YouTube esatto al " + corta(yt.g) + ": lo dà con 3 giorni di ritardo, il numero di adesso è arrotondato (" + fmt(yt.arrotondato) + ").");
  if (ADESSO.TikTok) note.push("TikTok: aggiornato la sera.");
  document.getElementById("nota-fol").textContent = note.join(" ");
}

/* ---- visualizzazioni ---- */
/* 22/11/2026 (Alessandro): Oggi e Ieri da mezzanotte a mezzanotte (ora italiana), dalle istantanee orarie;
   settimana, mese e 30 giorni sulle giornate ufficiali delle piattaforme (dalle 9 alle 9) */
const IERI = () => indietro(OGGI.giorno, 1);
const IERIP = () => indietro(OGGI.giornataP || OGGI.giorno, 1);
const oraDi = (t) => new Date(t * 1000).toLocaleTimeString("it-IT", { timeZone: "Europe/Rome", hour: "2-digit", minute: "2-digit" });
const lontana = (t) => { const [h, m] = oraDi(t).split(":").map(Number), x = h * 60 + m; return Math.min(x, 1440 - x) > 20; };
function intervallo(p) {          // [inizio, fine, inizio del periodo prima, nome del confronto]; fine = ultima giornata intera 9-9
  const ult = IERIP(), o = OGGI.giornataP || OGGI.giorno;
  if (p === "sett") { const d = new Date(o + "T00:00:00Z"), lun = indietro(o, (d.getUTCDay() + 6) % 7); return [lun, ult, indietro(lun, 7), "agli stessi giorni della settimana prima"]; }
  if (p === "mese") { const ini = o.slice(0, 8) + "01", d = new Date(ini + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 1);
    return [ini, ult, d.toISOString().slice(0, 10), "agli stessi giorni del mese prima"]; }
  return [indietro(ult, 29), ult, indietro(ult, 59), "ai 30 giorni prima"];
}
const val = (g, s) => (VIS[g] || {})[s];
const rom = (g, s) => (ROMA[g] || {})[s];
const ultimoDi = (s) => Object.keys(VIS).filter((g) => c(VIS[g][s])).sort().pop();
function visOggi(s) {
  if (s === "TikTok") { const u = ultimoDi(s); return { ora: null, nd: "aggiornato la sera", quando: u ? "ultimo giorno: " + dat(u) + ", " + fmt(val(u, s)) : "" }; }
  const r = rom(OGGI.giorno, s), prima = (OGGI.ieri_stessa_ora || {})[s];
  if (!r) return { ora: null, nd: "da mezzanotte: parte con l'istantanea delle 0:00", quando: "" };
  const da = lontana(r[1]) ? "dalle " + oraDi(r[1]) + " (prima istantanea)" : "da mezzanotte";
  return { ora: r[0], prima: c(prima) ? prima : null, nome: "a ieri alla stessa ora", quando: da + " alle " + oraDi(r[2]),
           nd: rom(IERI(), s) ? "ieri in tutto: " + fmt(rom(IERI(), s)[0]) : "" };
}
function visIeri(s) {
  const g = IERI(), p0 = indietro(g, 1);
  if (s === "TikTok") {
    if (!c(val(g, s))) return { ora: null, nd: "arriva stasera", quando: dat(g) };
    return { ora: val(g, s), prima: c(val(p0, s)) ? val(p0, s) : null, nome: "al giorno prima", quando: dat(g) + " · giornata di TikTok", nd: "manca il giorno prima", giorno: g };
  }
  const r = rom(g, s);
  if (r) {
    const pr = rom(p0, s), ist = lontana(r[1]) || lontana(r[2]) ? " · istantanee delle " + oraDi(r[1]) + " e delle " + oraDi(r[2]) : "";
    return { ora: r[0], prima: pr ? pr[0] : null, nome: "al giorno prima", quando: dat(g) + ", da mezzanotte a mezzanotte" + ist,
             nd: "il giorno prima da mezzanotte non c'è ancora", giorno: g };
  }
  /* manca l'istantanea di mezzanotte (i primi giorni): la giornata ufficiale dalle 9 alle 9 */
  if (c(val(g, s))) { const prov = (PROVV[s] || []).includes(g) ? ", provvisorio" : "";
    return { ora: val(g, s), prima: c(val(p0, s)) ? val(p0, s) : null, nome: "al giorno prima", quando: dat(g) + ", dalle 9 alle 9" + prov, nd: "manca il giorno prima", giorno: g }; }
  return { ora: null, nd: "in arrivo", quando: dat(g) };
}
function visPeriodo(s, p) {
  const [ini, fine, iniP, nome] = intervallo(p);
  if (fine < ini) return { ora: null, nd: "periodo appena cominciato: guarda Oggi", quando: "" };
  const n = tra(ini, fine) + 1;
  let ora = 0, oraC = 0, prima = 0, conta = 0, pari = 0, ultimo = null;
  for (let i = 0; i < n; i++) {
    const v = val(indietro(ini, -i), s), vp = val(indietro(iniP, -i), s);
    if (!c(v)) continue; ora += v; conta++; ultimo = indietro(ini, -i);
    if (c(vp)) { oraC += v; prima += vp; pari++; }
  }
  if (!conta) return { ora: null, nd: s === "TikTok" ? "aggiornato la sera" : "in arrivo", quando: "" };
  let quando = "da " + dat(ini) + " a " + dat(ultimo);
  if (conta < n) quando += " · " + conta + " giorni su " + n + (s === "TikTok" ? " (TikTok aggiornato la sera)" : "");
  const nota = pari && pari < conta ? " · confronto sui " + pari + " giorni con i numeri di prima" : "";
  return { ora, oraC, prima: pari ? prima : null, nome, quando, nota, nd: "mancano i numeri di prima" };
}
function visDi(s, p) { return p === "oggi" ? visOggi(s) : p === "ieri" ? visIeri(s) : visPeriodo(s, p); }
function visTotale(p) {
  const parti = SOC.map(([s]) => [s, visDi(s, p)]);
  /* Ieri: nel totale solo i social con il numero di ieri (TikTok arriva la sera) */
  const ok = parti.filter(([, x]) => c(x.ora) && (p !== "ieri" || x.giorno === IERI()));
  if (!ok.length) return { ora: null, nd: parti[0][1].nd, quando: "" };
  const fuori = parti.filter(([s]) => !ok.some(([t]) => t === s)).map(([s]) => s);
  const conf = ok.filter(([, x]) => c(x.prima)), senzaConf = ok.filter(([, x]) => !c(x.prima)).map(([s]) => s);
  let quando = p === "oggi" ? "da mezzanotte alle " + OGGI.ora : p === "ieri" ? dat(IERI()) : "da " + dat(intervallo(p)[0]) + " a " + dat(IERIP());
  if (fuori.length) quando += " · senza " + fuori.join(", ");
  return { ora: ok.reduce((a, [, x]) => a + x.ora, 0), oraC: conf.reduce((a, [, x]) => a + (c(x.oraC) ? x.oraC : x.ora), 0),
           prima: conf.length ? conf.reduce((a, [, x]) => a + x.prima, 0) : null, nome: ok[0][1].nome,
           nota: senzaConf.length && conf.length ? " · confronto senza " + senzaConf.join(", ") : "", quando,
           nd: p === "oggi" ? "confronto con ieri alla stessa ora appena c'è un giorno intero di istantanee" : "mancano i numeri di prima" };
}
function inclina(card) {
  if (!MOTO) return;
  const muovi = (ev) => {
    const r = card.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
    card.style.transform = `rotateX(${(0.5 - py) * 10}deg) rotateY(${(px - 0.5) * 12}deg) translateZ(6px)`;
    card.style.setProperty("--mx", px * 100 + "%"); card.style.setProperty("--my", py * 100 + "%");
  };
  card.addEventListener("pointermove", muovi); card.addEventListener("pointerdown", muovi);
  card.addEventListener("pointerleave", () => { card.style.transform = ""; });
}
function scheda(nome, colore, x) {
  const card = el("article", "card" + (nome === "Totale" ? " tot" : ""));
  const h = el("h3"); const d = el("span", "dot"); d.style.background = colore; d.style.color = colore; h.append(d, nome); card.append(h);
  const ok = c(x.ora);
  card.append(el("div", "big", ok ? fmt(x.ora) : "—"));
  if (x.quando) card.append(el("div", "day", x.quando));
  if (!ok || !c(x.prima)) {
    if (x.nd) card.append(el("div", "badge nd", x.nd));
  } else {
    const oc = c(x.oraC) ? x.oraC : x.ora;
    const diffN = oc - x.prima, p = x.prima ? Math.round((oc / x.prima - 1) * 100) : null;
    const b = el("div", "badge " + (diffN > 0 ? "su" : diffN < 0 ? "giu" : "pari"));
    b.append(el("span", "fr", diffN > 0 ? "▲" : diffN < 0 ? "▼" : "="), p === null ? "nuovo" : (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(p) + "%");
    card.append(b);
    const fr = el("div", "frase");
    fr.append(diffN === 0 ? "uguale " : el("b", "", segno(diffN)), " rispetto " + x.nome + " (", el("b", "", fmt(x.prima)), ")" + (x.nota || ""));
    card.append(fr);
    const max = Math.max(oc, x.prima, 1), duo = el("div", "duo");
    [[PERIODO === "oggi" ? "ieri" : "prima", x.prima, "p"], [PERIODO === "oggi" ? "oggi" : "adesso", oc, "o"]].forEach(([et, v, k]) => {
      const r = el("div"); r.append(el("span", "", et)); const pista = el("em"), barra = el("i", k); pista.append(barra); r.append(pista); duo.append(r);
      barra.style.width = Math.max(3, Math.min(100, (v / max) * 100)) + "%";
    });
    card.append(duo);
  }
  inclina(card);
  return card;
}
function disegnaVis() {
  const sv = document.getElementById("schede-vis"); sv.replaceChildren();
  sv.append(scheda("Totale", "#fff8e1", visTotale(PERIODO)));
  SOC.forEach(([s, col]) => sv.append(scheda(s, col, visDi(s, PERIODO))));
  document.getElementById("quando").textContent = PERIODO === "oggi"
    ? "Oggi da mezzanotte, confrontato con ieri alla stessa ora. TikTok non ha un collegamento diretto: i suoi numeri arrivano la sera."
    : PERIODO === "ieri" ? "Ieri da mezzanotte a mezzanotte, confrontato con il giorno prima." : "Giornate ufficiali delle piattaforme (dalle 9 alle 9), confrontate con lo stesso periodo prima.";
}

/* polvere d'oro che sale lenta sullo sfondo */
(function stelle() {
  const cv = document.getElementById("stelle"), cx = cv.getContext("2d"); let W, H, P = [];
  const misura = () => { const d = Math.min(2, window.devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    P = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + .3) * d, v: (Math.random() * .25 + .05) * d, f: Math.random() * 6.28 })); };
  misura(); addEventListener("resize", misura);
  const passo = (t) => {
    cx.clearRect(0, 0, W, H);
    P.forEach((p) => { const a = .35 + .45 * Math.sin(t / 900 + p.f);
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fillStyle = `rgba(255, 214, 10, ${a})`; cx.shadowBlur = 8 * p.r; cx.shadowColor = "#ffd60a"; cx.fill();
      if (MOTO) { p.y -= p.v; p.x += Math.sin(t / 2000 + p.f) * .15; if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } } });
    if (MOTO) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
})();

document.querySelectorAll("[data-conf=fol] button").forEach((b) => b.addEventListener("click", () => {
  CONF_FOL = b.dataset.c;
  document.querySelectorAll("[data-conf=fol] button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  disegnaFollower();
}));
document.querySelectorAll(".tabs[aria-label=Periodo] button").forEach((b) => b.addEventListener("click", () => {
  PERIODO = b.dataset.p;
  document.querySelectorAll(".tabs[aria-label=Periodo] button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  disegnaVis();
}));
function carica() {
  return fetch("dati.json?v=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((d) => {
    VIS = d.visualizzazioni || {}; ROMA = d.roma || {}; FOL = d.follower || {}; ADESSO = d.adesso || {}; PROVV = d.provvisori || {};
    const ult = Object.keys(VIS).sort().pop();
    OGGI = d.oggi || { giorno: ult ? indietro(ult, -1) : new Date().toISOString().slice(0, 10), finora: {}, ieri_stessa_ora: {} };
    if (d.aggiornato) document.getElementById("agg").textContent = "Aggiornato il " + d.aggiornato.slice(8, 10) + "/" + d.aggiornato.slice(5, 7) + " alle " + d.aggiornato.slice(11)
      + ". Oggi e Ieri: da mezzanotte a mezzanotte (ora italiana). Settimana, mese e 30 giorni: giornate ufficiali di Instagram, Facebook e YouTube, dalle 9 alle 9. TikTok: giornate di TikTok Studio, arrivano la sera.";
    disegnaFollower(); disegnaVis();
  });
}
carica().catch(() => { document.getElementById("agg").textContent = "Numeri non caricati: riprova tra poco."; });
/* 21/11: la pagina aperta si ricarica i numeri da sola ogni 10 minuti */
setInterval(() => { if (!document.hidden) carica().catch(() => {}); }, 600000);
