<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gara ai 10K</title>
<style>
  :root { --bg:#fafaf8; --fg:#1b1b1b; --mute:#6b6b6b; --line:#e4e2dc; --card:#fff;
          --ig:#c13584; --fb:#1877f2; --yt:#e62117; --tt:#111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#121212; --fg:#f0f0f0; --mute:#9a9a9a; --line:#2c2c2c; --card:#1b1b1b; --tt:#e8e8e8; } }
  :root[data-theme="dark"] { --bg:#121212; --fg:#f0f0f0; --mute:#9a9a9a; --line:#2c2c2c; --card:#1b1b1b; --tt:#e8e8e8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { color:var(--mute); margin:0 0 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .name { font-weight:600; }
  .num { font-variant-numeric:tabular-nums; font-size:22px; font-weight:700; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; border-radius:6px; }
  .meta { color:var(--mute); font-size:13px; margin-top:6px; }
  svg { width:100%; height:auto; display:block; }
  .leader { font-size:13px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--line); }
  footer { color:var(--mute); font-size:13px; margin-top:28px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Gara ai 10.000 follower</h1>
  <p class="sub">Stessi video, stessi orari, 4 piattaforme. Chi arriva prima?</p>
  <div class="card" id="coda"><div class="row"><span class="name">Video in coda</span><span class="num" id="codaNum">—</span></div><div id="codaBody" class="meta">Caricamento…</div></div>
  <div id="cards"></div>
  <div class="card"><div class="name">Andamento</div><div id="chart"></div></div>
  <div class="card" id="rep"><div class="name">Cosa funziona di piu'</div><div id="repBody" class="meta">Il report compare dopo il primo lunedi' con dei reel pubblicati.</div></div>
  <footer>Aggiornato ogni sera in automatico · <a href="app/">TikTok Publisher</a> · <a href="privacy.html">Privacy</a> · <a href="termini.html">Termini</a></footer>
</main>
<script>
const P = [["instagram","Instagram","--ig"],["tiktok","TikTok","--tt"],["youtube","YouTube","--yt"],["facebook","Facebook","--fb"]];
const GOAL = 10000;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
fetch("follower.json?" + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(data => {
  const last = data[data.length - 1] || {};
  const first = data[0] || {};
  const week = data[Math.max(0, data.length - 8)] || {};
  const ranked = P.filter(p => last[p[0]] != null).sort((a, b) => last[b[0]] - last[a[0]]);
  document.getElementById("cards").innerHTML = P.map(([k, n, c]) => {
    const v = last[k];
    const pct = v == null ? 0 : Math.min(100, v / GOAL * 100);
    const gain = v != null && week[k] != null ? v - week[k] : null;
    const perDay = gain != null && data.length > 1 ? gain / Math.min(7, data.length - 1) : 0;
    const eta = v != null && perDay > 0 ? Math.ceil((GOAL - v) / perDay) : null;
    return `<div class="card"><div class="row"><span class="name">${n}
      ${ranked[0] && ranked[0][0] === k ? '<span class="leader">in testa</span>' : ""}</span>
      <span class="num">${v == null ? "—" : v.toLocaleString("it-IT")}</span></div>
      <div class="bar"><i style="width:${pct}%;background:var(${c})"></i></div>
      <div class="meta">${pct.toFixed(1)}% di 10.000${gain != null ? ` · ${gain >= 0 ? "+" : ""}${gain} negli ultimi 7 giorni` : ""}${eta ? ` · al ritmo attuale: circa ${eta} giorni` : ""}</div></div>`;
  }).join("");
  if (data.length < 2) { document.getElementById("chart").innerHTML = '<p class="meta">Il grafico compare dopo 2 giorni di dati.</p>'; return; }
  const W = 720, H = 260, pad = 36;
  const max = Math.max(10, ...data.flatMap(d => P.map(p => d[p[0]] || 0)));
  const x = i => pad + i * (W - pad * 2) / (data.length - 1);
  const y = v => H - pad - v / max * (H - pad * 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento follower">`;
  for (let g = 0; g <= 4; g++) { const v = max * g / 4;
    s += `<line x1="${pad}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/>
          <text x="${pad - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="${css("--mute")}">${Math.round(v)}</text>`; }
  P.forEach(([k, n, c]) => {
    const pts = data.map((d, i) => d[k] == null ? null : `${x(i)},${y(d[k])}`).filter(Boolean).join(" ");
    if (pts) s += `<polyline fill="none" stroke="${css(c)}" stroke-width="2.5" points="${pts}"/>`;
  });
  s += `<text x="${pad}" y="${H - 10}" font-size="11" fill="${css("--mute")}">${data[0].data}</text>
        <text x="${W - pad}" y="${H - 10}" font-size="11" text-anchor="end" fill="${css("--mute")}">${data[data.length - 1].data}</text></svg>`;
  s += '<div class="meta">' + P.map(([k, n, c]) => `<span style="color:var(${c})">■</span> ${n}`).join(" &nbsp; ") + "</div>";
  document.getElementById("chart").innerHTML = s;
});
fetch("https://raw.githubusercontent.com/guarracinoalessandro96/reel-automazione/main/stato.json?" + Date.now())
  .then(r => r.ok ? r.json() : null).catch(() => null).then(st => {
  const body = document.getElementById("codaBody");
  if (!st) { body.textContent = "Stato non disponibile."; return; }
  const coda = Object.values(st.analisi || {}).sort((a, b) => (a.caricato || "").localeCompare(b.caricato || ""));
  document.getElementById("codaNum").textContent = coda.length;
  const giorni = coda.length / 10;
  let h = coda.length
    ? `Video nuovi per circa ${giorni < 1 ? "meno di un giorno" : Math.floor(giorni) + (Math.floor(giorni) === 1 ? " giorno" : " giorni")} a 10 reel al giorno. Poi si riusano quelli dell'archivio.`
    : "Nessun video nuovo: si pubblica dall'archivio. Carica nuovi video nella cartella Da pubblicare.";
  if (coda.length) h += "<br>" + coda.map(v => `${v.nome} · ${v.scena} · ${v.fascia || ""}`).join("<br>");
  const pub = (st.storico || []).slice(-10).reverse();
  if (pub.length) h += `<p style="margin:12px 0 2px;font-weight:600;color:var(--fg)">Ultimi pubblicati</p>` +
    pub.map(p => `${p.slot ? (String(p.slot).includes(":") ? p.slot : p.slot + ":00") : (p.quando || "").replace("T", " ")} · ${p.scena || ""}${p.da_archivio ? " · dall'archivio" : ""}`).join("<br>");
  body.innerHTML = h;
});
fetch("report.json?" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null).then(rep => {
  if (!rep || !rep.reel_analizzati) return;
  const riga = (o) => Object.entries(o).sort((a, b) => b[1].media_views - a[1].media_views)
    .map(([k, v]) => `<tr><td>${k}</td><td style="text-align:right">${v.media_views.toLocaleString("it-IT")}</td><td style="text-align:right;color:var(--mute)">${v.reel}</td></tr>`).join("");
  const tab = (tit, o) => `<p style="margin:14px 0 4px;font-weight:600">${tit}</p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="color:var(--mute)"><td></td><td style="text-align:right">views medie</td><td style="text-align:right">reel</td></tr>${riga(o)}</table>`;
  document.getElementById("repBody").innerHTML = `<p class="meta">Aggiornato il ${rep.data} su ${rep.reel_analizzati} reel. ${rep.nota || ""}</p>` +
    tab("Per tema", rep.per_tema) + tab("Per scena", rep.per_scena) + tab("Per orario", rep.per_orario);
});
</script>
</body>
</html>
