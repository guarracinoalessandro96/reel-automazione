name: Test riconoscimento scene

on:
  workflow_dispatch:
  push:
    paths: ["test_scena.py", ".github/workflows/test-scena.yml"]

concurrency: test-scena

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b-32-openai
      - name: Installa
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Prova
        run: python test_scena.py
      - name: Salva il risultato
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add diagnosi_scena.txt
          git diff --cached --quiet || (git commit -m "Diagnosi scene" && git pull --rebase && git push)
