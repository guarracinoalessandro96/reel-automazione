name: Pubblica Reel

on:
  schedule:
    # GitHub usa l'ora UTC e, quando e' carico, salta o ritarda molte esecuzioni programmate (dal 3/10/2026
    # ne partivano 2-5 su 10). Per questo il controllo gira ogni 20 minuti (minuti "strani", meno affollati):
    # orario.py guarda l'ora di Roma e pubblica una sola volta per slot (9, 12, 15, 18, 21; finestra di 3 ore).
    # Le esecuzioni senza niente da fare durano pochi secondi (repository pubblico: minuti gratuiti).
    # 11/10/2026: ogni 10 minuti (e orario.py accetta uno slot fino a 10' prima) -> reel quasi in orario anche a PC spento
    # 18/10/2026: uno Short ogni ora, 24 ore su 24 -> controllo ogni 10 minuti a tutte le ore
    - cron: "3,13,23,33,43,53 * * * *"
  push:              # avvio "di riserva": modificare avvia.txt (commit + push) fa partire il controllo subito,
    paths: ["avvia.txt"]   # senza i ritardi delle esecuzioni programmate di GitHub
  workflow_dispatch:
    inputs:
      forza:
        description: "Pubblica subito il prossimo video (ignora l'orario)"
        type: boolean
        default: true

concurrency: pubblica

permissions:
  contents: write
  actions: write     # 30/10/2026: per avviare da solo il lavoro successivo (catena, vedi in fondo)

jobs:
  pubblica:
    runs-on: ubuntu-24.04
    timeout-minutes: 355   # 25/10/2026: resta acceso a lungo e fa da solo gli orari successivi (30/10: ~5,5 ore)
    steps:
      # 11/10/2026: ref main = lo stato PIU' RECENTE (senza, un controllo in coda dietro a un altro leggeva lo stato
      # di quando era partito e ripubblicava lo stesso orario: alle 15:00 erano usciti 2 reel)
      - uses: actions/checkout@v4
        with:
          ref: main

      # 16/10/2026: i video mandati al bot Telegram finiscono in "Da pubblicare" (piu' veloce che caricarli su Drive)
      - name: Video arrivati su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_DA_PUBBLICARE: ${{ secrets.DRIVE_FOLDER_DA_PUBBLICARE }}
        run: python3 ricevi_telegram.py || true

      - name: Tocca pubblicare adesso?
        id: orario
        run: |
          git pull -q --ff-only origin main || true
          SLOT="$(python3 orario.py)"
          if [ -n "$SLOT" ] && [ "$(python3 coda.py)" = "0" ] && ! grep -q '"riprova": \[[^]]' stato.json; then
            echo "Nessun video in coda e niente da riprovare: mi fermo qui."
            SLOT=""
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          # 30/10/2026: il 29/10 GitHub ha avviato le esecuzioni programmate solo 6 volte in 24 ore (buchi di 5-7 ore,
          # 5 orari su 12 saltati). Ora ogni lavoro RESTA ACCESO (anche se adesso non c'e' niente da fare) e alla fine
          # avvia da solo il successivo: la macchina non si spegne mai. resta=0 solo con PAUSA o senza video.
          if [ -f PAUSA ] || [ "$(python3 coda.py)" = "0" ]; then echo "resta=0" >> "$GITHUB_OUTPUT"; else echo "resta=1" >> "$GITHUB_OUTPUT"; fi
        env:
          FORZA: ${{ github.event_name == 'workflow_dispatch' && inputs.forza && '1' || '0' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_DA_PUBBLICARE: ${{ secrets.DRIVE_FOLDER_DA_PUBBLICARE }}

      - uses: actions/setup-python@v5
        if: steps.orario.outputs.resta == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Memoria del modello di riconoscimento scene
        if: steps.orario.outputs.resta == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b-32-openai

      - name: Installa
        if: steps.orario.outputs.resta == '1'
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # PARLATO (18/10/2026): modello della voce per i video in cui Alessandro parla. La libreria si installa da sola
      # (parlato.py) solo quando arriva un video parlato; se non riesce, il video resta un reel normale.
      - name: Memoria del modello della voce
        if: steps.orario.outputs.resta == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-v1

      - name: Pubblica il prossimo video
        if: steps.orario.outputs.resta == '1'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_DA_PUBBLICARE: ${{ secrets.DRIVE_FOLDER_DA_PUBBLICARE }}
          DRIVE_FOLDER_PUBBLICATI: ${{ secrets.DRIVE_FOLDER_PUBBLICATI }}
          DRIVE_FOLDER_PRONTI: ${{ secrets.DRIVE_FOLDER_PRONTI }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'bozze' }}
          SALTA_INSTAGRAM: ${{ vars.SALTA_INSTAGRAM }}
          SALTA_FACEBOOK: ${{ vars.SALTA_FACEBOOK }}
          SALTA_YOUTUBE: ${{ vars.SALTA_YOUTUBE }}
          SALTA_TIKTOK: ${{ vars.SALTA_TIKTOK }}
          SENZA_MUSICA: ${{ vars.SENZA_MUSICA }}
          SENZA_COLORE: ${{ vars.SENZA_COLORE }}
          SENZA_STORIE: ${{ vars.SENZA_STORIE }}
        # 25/10/2026: le esecuzioni programmate di GitHub partono a singhiozzo (il 25/10 solo 12 in 19 ore) e la
        # sveglia del PC a volte non ha rete: una volta partito, il lavoro resta acceso fino a ~4,5 ore e fa da solo
        # anche gli orari successivi (salva lo stato dopo ognuno). Il lavoro dopo riparte appena questo finisce.
        run: |
          salva() {
            git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
            git add stato.json; git diff --cached --quiet && return 0
            git commit -q -m "Reel $1"
            for i in 1 2 3 4 5; do
              git pull --rebase -q && git push -q && return 0
              git rebase --abort 2>/dev/null || true; sleep $((i * 5))
            done
          }
          SLOT="${{ steps.orario.outputs.slot }}"
          FINE=$((SECONDS + 320 * 60))
          while [ $SECONDS -lt $FINE ]; do
            if [ -n "$SLOT" ]; then
              python pubblica.py "$SLOT" || echo "Orario $SLOT: pubblicazione non riuscita"
              salva "$SLOT"
            fi
            SLOT=""
            while [ -z "$SLOT" ] && [ $SECONDS -lt $FINE ]; do
              sleep 240
              git pull -q --rebase || git rebase --abort 2>/dev/null || true
              python3 ricevi_telegram.py > /dev/null 2>&1 || true
              [ -f PAUSA ] || SLOT="$(python3 orario.py)"
            done
          done

      - name: Salva lo stato
        if: always() && steps.orario.outputs.resta == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add stato.json
          git diff --cached --quiet && exit 0
          git commit -m "Reel ${{ steps.orario.outputs.slot }}"
          # 18/10/2026: fino a 5 tentativi. Uno stato non salvato = il lavoro dopo (che parte subito, in coda) non sa
          # che l'orario e' fatto e lo ripubblica: con un reel ogni ora non deve succedere mai.
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      # 30/10/2026: CATENA. Prima di spegnersi il lavoro avvia il successivo (workflow_dispatch con GITHUB_TOKEN: e'
      # l'unico evento che GitHub lascia partire cosi'). Resta in coda finche' questo non finisce, poi riparte subito.
      - name: Avvia il lavoro successivo
        if: always() && steps.orario.outputs.resta == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pubblica.yml/dispatches" \
            -d '{"ref":"main","inputs":{"forza":"false"}}' && echo "Lavoro successivo avviato"
