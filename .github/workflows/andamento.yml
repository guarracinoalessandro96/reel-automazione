name: Andamento social

# 14/11/2026 (Alessandro: dashboard pubblica giorno per giorno dei 4 social, "non voglio dipendere da Claude"):
# ogni mattina, dopo il messaggio delle 8, aggiorna docs/andamento/dati.json (pagina docs/andamento/ su GitHub Pages).
# Due orari perche' GitHub a volte salta le esecuzioni programmate.
on:
  schedule:
    - cron: "45 8 * * *"
      timezone: "Europe/Rome"
    - cron: "45 11 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch: {}

concurrency: andamento

permissions:
  contents: write

jobs:
  andamento:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python andamento.py
      - run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add docs/andamento/dati.json
          git diff --cached --quiet && exit 0
          git commit -m "Andamento social $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done
          exit 1
