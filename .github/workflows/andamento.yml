name: Andamento social

# 14/11/2026 (Alessandro: dashboard pubblica giorno per giorno dei 4 social, "non voglio dipendere da Claude"):
# ogni mattina, dopo il messaggio delle 8, aggiorna docs/andamento/dati.json (pagina docs/andamento/ su GitHub Pages).
# Due orari perche' GitHub a volte salta le esecuzioni programmate.
on:
  # 15/11: le due esecuzioni delle 8:45 e 11:45 non sono mai partite (pagina ferma al 14/11). Ora ogni 2 ore,
  # ora UTC e minuti "strani" (meno affollati): se GitHub ne salta qualcuna, la successiva recupera.
  # 21/11/2026 (Alessandro: confronto il piu' vicino possibile al tempo reale): ogni ora (le istantanee servono per
  # "oggi finora" e "ieri alla stessa ora"); in piu' parte dopo ogni reel (pubblica.yml) e dopo i lavori qui sotto.
  schedule:
    - cron: "23 * * * *"
    # 22/11/2026: istantanea vicinissima alla MEZZANOTTE italiana ("Oggi"/"Ieri" da mezzanotte). Due orari perche'
    # GitHub ritarda i cron; si usa quella piu' vicina alle 0:00. Ora UTC: d'inverno 22:50/23:05 = 23:50/0:05 italiane,
    # d'estate 21:50/22:05 = 23:50/0:05 (le altre due capitano a 0:50/1:05 o 22:50/23:05: innocue).
    - cron: "50 21,22 * * *"
    - cron: "5 22,23 * * *"
  # 15/11 sera: anche gli orari ogni 2 ore non partivano. Allora parte anche dopo i lavori che GitHub esegue davvero.
  workflow_run:
    workflows: ["Report", "Controllo salute", "Statistiche di riserva"]
    types: [completed]
  workflow_dispatch: {}

concurrency: andamento

permissions:
  contents: write

jobs:
  andamento:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth openpyxl
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRIVE_FOLDER_DA_PUBBLICARE: ${{ secrets.DRIVE_FOLDER_DA_PUBBLICARE }}   # 22/11: per trovare "0. Reel Alessandro" (foglio.py)
        run: python andamento.py
      - run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add docs/andamento/dati.json
          git diff --cached --quiet && exit 0
          git commit -m "Andamento social $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done
          exit 1
